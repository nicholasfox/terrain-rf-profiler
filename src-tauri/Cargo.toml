[package]
name = "los"
version = "0.1.0"
description = "LOS RF Line-of-Sight Analysis Tool"
authors = ["nicholas"]
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
